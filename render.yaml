# render.yaml — Render Blueprint
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Configuration unique du service relié au dépôt Jamin-007/ligne-hosted-preview.

services:
  - type: web
    name: ligne-hosted-preview
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true

    # Render fournit pnpm via PNPM_VERSION. Les dépendances de développement sont
    # nécessaires à la compilation vinext et à l'audit de confidentialité.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: PNPM_VERSION
        value: "11.19.0"
      - key: COREPACK_INTEGRITY_KEYS
        value: "0"
      - key: WRANGLER_LOG_PATH
        value: .wrangler/wrangler.log
      # Secrets: sync:false -> set once in the Render dashboard, never stored in git.
      - key: REOWN_PROJECT_ID
        sync: false
      - key: MAINNET_RECEIVER_ADDRESS
        sync: false
      - key: BITCOIN_RECEIVER_ADDRESS
        sync: false
